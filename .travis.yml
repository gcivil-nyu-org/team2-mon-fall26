language: minimal

services:
  - docker

env:
  global:
    - DJANGO_SECRET_KEY=ci-only-test-secret
    - DJANGO_DEBUG=0
    - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
    - DEMO_MODE=0
    - MYSQL_DATABASE=connectnyc
    - MYSQL_USER=connectnyc
    - MYSQL_PASSWORD=ci-test-password
    - MYSQL_ROOT_PASSWORD=ci-test-root-password
    - MYSQL_HOST=db
    - MYSQL_PORT=3306
    - WEB_PORT=8000

script:
  - docker compose up --build --wait
  - docker compose exec -T db sh -c "mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"GRANT ALL PRIVILEGES ON *.* TO 'connectnyc'@'%'; FLUSH PRIVILEGES;\""
  - docker compose exec -T web black --check .
  - docker compose exec -T web flake8 .
  - docker compose exec -T web coverage run --data-file=/tmp/.coverage --source=. manage.py test --noinput
  - docker compose exec -T web coverage report --data-file=/tmp/.coverage -m

after_success:
  - |
    coverage_pull_request="${TRAVIS_PULL_REQUEST:-false}"
    if [ "$coverage_pull_request" = "false" ]; then
      coverage_pull_request=""
    fi
    docker compose exec -T \
      -e COVERAGE_FILE=/tmp/.coverage \
      -e TRAVIS -e TRAVIS_JOB_ID \
      -e TRAVIS_BRANCH="$TRAVIS_BRANCH" \
      -e TRAVIS_REPO_SLUG="$TRAVIS_REPO_SLUG" \
      -e TRAVIS_PULL_REQUEST="$coverage_pull_request" \
      -e COVERALLS_REPO_TOKEN \
      -e GIT_BRANCH="${TRAVIS_PULL_REQUEST_BRANCH:-$TRAVIS_BRANCH}" \
      -e GIT_ID="$(git rev-parse HEAD)" \
      -e GIT_AUTHOR_NAME="$(git log -1 --format=%aN)" \
      -e GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae)" \
      -e GIT_COMMITTER_NAME="$(git log -1 --format=%cN)" \
      -e GIT_COMMITTER_EMAIL="$(git log -1 --format=%ce)" \
      -e GIT_MESSAGE="$(git log -1 --format=%s)" \
      -e GIT_REMOTE=origin \
      -e GIT_URL="https://github.com/$TRAVIS_REPO_SLUG.git" \
      web coveralls

after_script:
  - docker compose down -v

deploy:
  - provider: elasticbeanstalk
    access_key_id: $AWS_ACCESS_KEY_ID
    secret_access_key: $AWS_SECRET_ACCESS_KEY
    region: us-east-2
    app: connectnyc
    env: connectnyc-integration
    bucket: elasticbeanstalk-us-east-2-961394077833
    edge: true
    on:
      branch: develop

  - provider: elasticbeanstalk
    access_key_id: $AWS_ACCESS_KEY_ID
    secret_access_key: $AWS_SECRET_ACCESS_KEY
    region: us-east-2
    app: connectnyc
    env: connectnyc-production
    bucket: elasticbeanstalk-us-east-2-961394077833
    edge: true
    on:
      branch: main
